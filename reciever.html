<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Receiver - QR Code Scanner</title>
    <!-- jsQR Library for browser-based QR decoding -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #ffffff;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 20px auto;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }

        video {
            width: 100%;
            display: block;
        }

        canvas {
            display: none;
        }

        .status-box {
            background-color: #2a2a2a;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: left;
            font-family: monospace;
            font-size: 14px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #333;
            border-radius: 6px;
            height: 12px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00e676;
            transition: width 0.2s ease;
        }

        button {
            background-color: #2979ff;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1565c0;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .download-btn {
            background-color: #00e676;
            color: #000;
            margin-top: 10px;
            display: inline-block;
            text-decoration: none;
            padding: 12px 24px;
            font-weight: bold;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Optical Stream Receiver</h2>
    <p>Point camera at the transmitting screen to capture frames.</p>

    <div class="video-wrapper">
        <video id="webcam" playsinline></video>
        <canvas id="qr-canvas"></canvas>
    </div>

    <div class="status-box">
        <div><strong>Status:</strong> <span id="status-text">Idle</span></div>
        <div><strong>Progress:</strong> <span id="frame-counter">0 / 0 frames</span></div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
    </div>

    <button id="start-btn" onclick="startScanner()">Start Camera</button>
    <div id="download-area"></div>
</div>

<script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');
    
    const statusText = document.getElementById('status-text');
    const frameCounter = document.getElementById('frame-counter');
    const progressBar = document.getElementById('progress-bar');
    const startBtn = document.getElementById('start-btn');
    const downloadArea = document.getElementById('download-area');

    let isScanning = false;
    let receivedChunks = {};
    let totalFrames = 0;
    let animationFrameId = null;

    async function startScanner() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" } 
            });
            video.srcObject = stream;
            video.setAttribute("playsinline", true);
            video.play();
            
            isScanning = true;
            startBtn.disabled = true;
            statusText.innerText = "Scanning for QR stream...";
            
            requestAnimationFrame(scanFrame);
        } catch (err) {
            alert("Camera access failed: " + err.message);
        }
    }

    function scanFrame() {
        if (!isScanning) return;

        if (video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.height = video.videoHeight;
            canvas.width = video.videoWidth;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height, {
                inversionAttempts: "dontInvert",
            });

            if (code && code.data) {
                processPacket(code.data);
            }
        }

        animationFrameId = requestAnimationFrame(scanFrame);
    }

    function processPacket(packetString) {
        // Expected format: "Index|Total|Payload"
        const parts = packetString.split("|");
        
        if (parts.length < 3) return; // Invalid frame format

        const frameIndex = parseInt(parts[0], 10);
        const total = parseInt(parts[1], 10);
        const payload = parts.slice(2).join("|"); // Rejoin in case payload contains delimiter

        if (isNaN(frameIndex) || isNaN(total)) return;

        // Initialize total frames count on first detected frame
        if (totalFrames === 0) {
            totalFrames = total;
        }

        // Store new chunk if not already received
        if (!receivedChunks.hasOwnProperty(frameIndex)) {
            receivedChunks[frameIndex] = payload;

            const receivedCount = Object.keys(receivedChunks).length;
            const percentage = Math.floor((receivedCount / totalFrames) * 100);

            // Update UI
            frameCounter.innerText = `${receivedCount} / ${totalFrames} frames (${percentage}%)`;
            progressBar.style.width = `${percentage}%`;
            statusText.innerText = `Receiving frame ${frameIndex + 1}...`;

            // Check if transmission is complete
            if (receivedCount === totalFrames) {
                completeTransfer();
            }
        }
    }

    function completeTransfer() {
        isScanning = false;
        cancelAnimationFrame(animationFrameId);

        // Stop camera stream
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
        }

        statusText.innerText = "Assembly complete! Reconstructing file...";
        
        // Reassemble payload sequentially from index 0 to totalFrames - 1
        let fullBase64 = "";
        for (let i = 0; i < totalFrames; i++) {
            fullBase64 += receivedChunks[i];
        }

        try {
            // Convert Base64 string back to binary Blob
            const blob = base64ToBlob(fullBase64);
            const downloadUrl = URL.createObjectURL(blob);

            statusText.innerText = "File successfully reassembled!";
            
            // Create download link
            downloadArea.innerHTML = `
                <a href="${downloadUrl}" download="reconstructed_file" class="download-btn">
                    Download Restored File
                </a>
            `;
        } catch (e) {
            statusText.innerText = "Error decoding file: " + e.message;
        }
    }

    function base64ToBlob(base64String) {
        // Strip data URI header if present
        const cleanBase64 = base64String.replace(/^data:.*?;base64,/, "");
        const binaryString = atob(cleanBase64);
        const bytes = new Uint8Array(binaryString.length);

        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }

        return new Blob([bytes], { type: "application/octet-stream" });
    }
</script>

</body>
</html>
