<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Raw Binary Optical Receiver</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #00ffcc;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 15px;
    }
    #controls {
      margin-bottom: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .video-container {
      position: relative;
      border: 2px solid #00ffcc;
    }
    video {
      display: block;
      max-width: 100%;
      height: auto;
    }
    canvas {
      display: none; /* Processing canvas runs in background */
    }
    #stats {
      margin-top: 10px;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 4px;
      border: 1px solid #333;
      width: 90%;
      max-width: 600px;
    }
    button {
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background: #444; color: #888; }
  </style>
</head>
<body>

  <h2>Raw Optical Receiver (Camera Engine)</h2>

  <div id="controls">
    <button id="startCamBtn">Start Camera</button>
    <button id="stopCamBtn" disabled>Stop</button>
    <label>Block Size:
      <select id="blockSizeSelect">
        <option value="16">16px Blocks</option>
        <option value="8" selected>8px Blocks</option>
        <option value="4">4px Blocks</option>
      </select>
    </label>
  </div>

  <div class="video-container">
    <video id="webcam" autoplay playsinline></video>
  </div>

  <canvas id="procCanvas" width="1280" height="720"></canvas>

  <div id="stats">Click "Start Camera" and point at the transmitter monitor...</div>

  <script>
    // 8-Color Palette (RGB)
    const PALETTE = [
      [0, 0, 0],       // 000: Black
      [255, 0, 0],     // 001: Red
      [0, 255, 0],     // 010: Green
      [0, 0, 255],     // 011: Blue
      [255, 255, 0],   // 100: Yellow
      [0, 255, 255],   // 101: Cyan
      [255, 0, 255],   // 110: Magenta
      [255, 255, 255]  // 111: White
    ];

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('procCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let stream = null;
    let animFrameId = null;
    let receivedFrames = new Map();
    let totalFramesExpected = 0;
    let isProcessing = false;

    // Nearest Color Match via Euclidean Distance
    function getClosestColorBits(r, g, b) {
      let minDist = Infinity;
      let bestIdx = 0;
      for (let i = 0; i < PALETTE.length; i++) {
        const [pr, pg, pb] = PALETTE[i];
        const dist = Math.hypot(r - pr, g - pg, b - pb);
        if (dist < minDist) {
          minDist = dist;
          bestIdx = i;
        }
      }
      return bestIdx; // Returns 0-7 index (3 bits)
    }

    document.getElementById('startCamBtn').addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        document.getElementById('startCamBtn').disabled = true;
        document.getElementById('stopCamBtn').disabled = false;
        
        video.onloadedmetadata = () => {
          isProcessing = true;
          processVideoLoop();
        };
      } catch (err) {
        alert("Camera Error: " + err.message);
      }
    });

    document.getElementById('stopCamBtn').addEventListener('click', () => {
      isProcessing = false;
      if (animFrameId) cancelAnimationFrame(animFrameId);
      if (stream) stream.getTracks().forEach(t => t.stop());
      document.getElementById('startCamBtn').disabled = false;
      document.getElementById('stopCamBtn').disabled = true;
    });

    function processVideoLoop() {
      if (!isProcessing) return;

      // Draw current video frame to processing canvas
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      const blockSize = parseInt(document.getElementById('blockSizeSelect').value);
      const cols = Math.floor(canvas.width / blockSize);
      const rows = Math.floor(canvas.height / blockSize);

      let bitStream = [];

      // Loop through block centers
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          // Skip corners
          if ((r < 2 || r >= rows - 2) && (c < 2 || c >= cols - 2)) continue;

          const cx = Math.floor((c + 0.5) * blockSize);
          const cy = Math.floor((r + 0.5) * blockSize);
          const idx = (cy * canvas.width + cx) * 4;

          const rVal = data[idx];
          const gVal = data[idx + 1];
          const bVal = data[idx + 2];

          const colorIdx = getClosestColorBits(rVal, gVal, bVal);
          
          // Push 3 bits to stream
          bitStream.push((colorIdx >> 2) & 1);
          bitStream.push((colorIdx >> 1) & 1);
          bitStream.push(colorIdx & 1);
        }
      }

      // Parse 12-byte Header (96 bits)
      if (bitStream.length >= 96) {
        const frameIdx = parse32BitInt(bitStream, 0);
        const totalFrames = parse32BitInt(bitStream, 32);
        const payloadLen = parse32BitInt(bitStream, 64);

        if (totalFrames > 0 && totalFrames < 100000 && payloadLen > 0) {
          totalFramesExpected = totalFrames;

          if (!receivedFrames.has(frameIdx)) {
            // Extract raw payload bytes
            const payloadBits = bitStream.slice(96, 96 + (payloadLen * 8));
            const payloadBytes = new Uint8Array(payloadLen);
            
            for (let i = 0; i < payloadLen; i++) {
              let byte = 0;
              for (let b = 0; b < 8; b++) {
                byte = (byte << 1) | (payloadBits[i * 8 + b] || 0);
              }
              payloadBytes[i] = byte;
            }

            receivedFrames.set(frameIdx, payloadBytes);
            updateStats();

            // Auto-trigger download when complete
            if (receivedFrames.size === totalFramesExpected) {
              assembleAndDownload();
            }
          }
        }
      }

      animFrameId = requestAnimationFrame(processVideoLoop);
    }

    function parse32BitInt(bitArr, offset) {
      let val = 0;
      for (let i = 0; i < 32; i++) {
        val = (val << 1) | (bitArr[offset + i] || 0);
      }
      return val >>> 0; // Convert to unsigned int
    }

    function updateStats() {
      const pct = totalFramesExpected ? ((receivedFrames.size / totalFramesExpected) * 100).toFixed(1) : 0;
      document.getElementById('stats').innerText = 
        `Progress: ${receivedFrames.size} / ${totalFramesExpected || '?'} Frames Captured (${pct}%)`;
    }

    function assembleAndDownload() {
      isProcessing = false;
      alert("Transmission Complete! Assembling file...");

      // Sort frames by index
      let totalSize = 0;
      const sortedKeys = Array.from(receivedFrames.keys()).sort((a, b) => a - b);
      sortedKeys.forEach(k => totalSize += receivedFrames.get(k).length);

      const combined = new Uint8Array(totalSize);
      let offset = 0;
      sortedKeys.forEach(k => {
        const chunk = receivedFrames.get(k);
        combined.set(chunk, offset);
        offset += chunk.length;
      });

      // Trigger browser download
      const blob = new Blob([combined], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'extracted_payload.bin';
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
